<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | Contacts

    </title>
    <link
      rel="icon"
      href="../../assets/icons/logoFavicon.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/variables.css" />
    <link rel="stylesheet" href="../styles/standard.css" />
    <link rel="stylesheet" href="../styles/layout.css" />
    <link rel="stylesheet" href="../styles/standard.css" />
    <link rel="stylesheet" href="../styles/contacts.css" />
      <script src="../../script/script.js"></script>
  </head>

  <body class="app" onload="initLayout()">
    <!-- Sidebar and header come from the shared templates (built by the team) -->
    <div
      id="sidebarContainer"
      w3-include-html="../templates/sidebar.html"
    ></div>
    <div id="headerContainer" w3-include-html="../templates/header.html"></div>

    <main class="contacts-page">
      <div class="contacts-head">
        <h1 class="contacts-title">Contacts</h1>





<div id="overlay-add-contact" class="overlay d-none">
  ...<div class="overlay-header">
    <h2 class="overlay-title">Add contact</h2>
   <span class="overlay-subtitle">Tasks are better with the team</span>
    </div>

    <div class="contact-avatar" /div>

    <div>
         <div class="input-field">
            <input type="text" id="edit-name" placeholder="Name">
            <img src="./img/person.svg" alt="">
        </div>

        <div class="input-field">
            <input type="email" id="edit-email" placeholder="Email">
            <img src="./img/mail.svg" alt="">
        </div>

        <div class="input-field">
            <input type="tel" id="edit-phone" placeholder="Phone">
            <img src="./img/call.svg" alt="">
        </div>
    </div>
     
</div>



<div id="overlay-edit-contact" class="overlay d-none">
  ...<div class="overlay-header">
    <h2 class="overlay-title">Edit contact</h2>
   <span class="overlay-subtitle">Tasks are better with the team</span>
    </div>

    <div class="contact-avatar"></div>

    <div>
         <div class="input-field">
            <input type="text" id="edit-name" placeholder="Name">
            <img src="./img/person.svg" alt="">
        </div>

        <div class="input-field">
            <input type="email" id="edit-email" placeholder="Email">
            <img src="./img/mail.svg" alt="">
        </div>

        <div class="input-field">
            <input type="tel" id="edit-phone" placeholder="Phone">
            <img src="./img/call.svg" alt="">
        </div>
    </div>

  <button id="btn-delete-contact">Delete</button>
  <button id="btn-save-contact">Save</button>
</div>
       

</div>
