<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | Contacts</title>
    <link
      rel="icon"
      href="../../assets/icons/logoFavicon.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/variables.css" />
    <link rel="stylesheet" href="../styles/standard.css" />
    <link rel="stylesheet" href="../styles/layout.css" />
    <link rel="stylesheet" href="../styles/standard.css" />
    <link rel="stylesheet" href="../styles/contacts.css" />
    <script src="../../script/api.js"></script>
    <script src="../../script/script.js"></script>
    <script src="../../script/contacts.js"></script>
  </head>

  <body class="app" onload="initLayout(); renderContacts()">
    <!-- Sidebar and header come from the shared templates (built by the team) -->
    <div
      id="sidebarContainer"
      w3-include-html="../templates/sidebar.html"
    ></div>
    <div id="headerContainer" w3-include-html="../templates/header.html"></div>

    <main id="contacts-page">
        <section class="contacts-list">
          <button id="btn-new-contact">
            Add new contact
            <img
              id="icon-new-contact"
              src="/assets/icons/person_add.svg"
              alt="new contact"
            />
          </button>
          <img
            id="icon-new-contact"
            src="/assets/icons/person_add.svg"
            alt="new contact"
          />
          <div id="contacts-list-contact"></div>
        </section>

        <section class="contact-details">
          <article id="contact-details-container">
            <div class="contact-details-header">
              <h3>Contacts</h3>
              <div class="seperator"></div>
              <p class="headline-txt">Better with a team</p>
            </div>





            
          </article>
        </section>
    </main>
  </body>
</html>
