<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | Contacts

    </title>
    <link
      rel="icon"
      href="../../assets/icons/logoFavicon.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/variables.css" />
    <link rel="stylesheet" href="../styles/standard.css" />
    <link rel="stylesheet" href="../styles/layout.css" />
    <link rel="stylesheet" href="../styles/standard.css" />
    <link rel="stylesheet" href="../styles/contacts.css" />
      <script src="../../script/script.js"></script>
  </head>

  <body class="app" onload="initLayout()">
    <!-- Sidebar and header come from the shared templates (built by the team) -->
    <div
      id="sidebarContainer"
      w3-include-html="../templates/sidebar.html"
    ></div>
    <div id="headerContainer" w3-include-html="../templates/header.html"></div>

    <main class="contacts-page">
      <div class="contacts-head">
        <h1 class="contacts-title">Contacts</h1>



<div id="overlay-add-contact" class="overlay-backdrop d-none">
  <div class="overlay">

    <div class="overlay-header">
      <button class="overlay-close" onclick="closeOverlay()">
        <img src="/assets/icons/close.svg" alt="Close">
      </button>
      <h2 class="overlay-title">Add contact</h2>
      <p class="overlay-subtitle">Tasks are better with a team!</p>

      <div class="contact-avatar">
      <img class="avatar-icon" src="/assets/icons/person.svg" alt="Avatar"  >
      </div>
    </div>

    <div class="overlay-content">
      <form id="add-contact-form" class="contact-form">

        <div class="input-field">
          <input type="text" id="add-name" placeholder="Name" required>
          <img src="/assets/icons/person.svg" alt="Name">
        </div>

        <div class="input-field">
          <input type="email" id="add-email" placeholder="Email" required>
          <img src="/assets/icons/mail.svg" alt="Email">
        </div>

        <div class="input-field">
          <input type="tel" id="add-phone" placeholder="Phone">
          <img src="/assets/icons/phone.svg" alt="Phone">
        </div>

        <button type="submit" class="btn-primary">Create contact</button>
      </form>
    </div>

  </div>
</div>

</div>
</main>
</body>
</html>
